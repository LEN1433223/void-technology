<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>虚空石碑 · 交互面板</title>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="art" width="528" height="300"></canvas>
<script>
/* 虚空石碑交互面板：176 × 88 GUI 像素，3× 渲染（528 × 264）
   与控制器/供应器同一套底（红黑 + 烬色 + 金），但更小、更"石碑"：
   顶部标题带 + 两道按钮凹槽（按钮本体由 LDLib2 绘制在凹槽里）。 */
const W = 176, H = 100, S = 3;
const C = {
  core: '#4a0e12', mid: '#2b0a0d', edge: '#140708', deep: '#0a0405',
  frame: '#5a1418', frameInner: '#16090b', rivet: '#6a2a30',
  gold: '#d8b25c', goldDim: 'rgba(200,162,74,0.5)',
  ember: '#ff6a4a',
  well: '#0a0507', wellHi: '#3a1f24'
};
const ctx = document.getElementById('art').getContext('2d');

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* 底 */
function base() {
  for (let i = -H; i < W + H; i += 4) {
    ctx.fillStyle = '#150a0d';
    ctx.beginPath();
    ctx.moveTo(i, 0); ctx.lineTo(i + 2, 0);
    ctx.lineTo(i + 2 - H, H); ctx.lineTo(i - H, H);
    ctx.closePath(); ctx.fill();
  }
  const g = ctx.createRadialGradient(W / 2, H * 0.3, 6, W / 2, H * 0.3, 120);
  g.addColorStop(0.00, C.core);
  g.addColorStop(0.45, C.mid);
  g.addColorStop(0.78, C.edge);
  g.addColorStop(1.00, C.deep);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.015)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
}

/* 外框 */
function frame() {
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
  ctx.strokeStyle = C.frame; ctx.lineWidth = 2; ctx.strokeRect(1.5, 1.5, W - 3, H - 3);
  ctx.strokeStyle = C.frameInner; ctx.lineWidth = 1; ctx.strokeRect(2.5, 2.5, W - 5, H - 5);
  ctx.fillStyle = C.rivet;
  [[4, 4], [W - 7, 4], [4, H - 7], [W - 7, H - 7]].forEach(([x, y]) => ctx.fillRect(x, y, 3, 3));
}

/* 标题带 */
function header() {
  const band = 20;
  const g = ctx.createLinearGradient(0, 0, 0, band);
  g.addColorStop(0, 'rgba(90,20,24,0.55)');
  g.addColorStop(1, 'rgba(20,7,8,0.10)');
  ctx.fillStyle = g;
  ctx.fillRect(3, 3, W - 6, band - 3);
  ctx.fillStyle = C.goldDim;
  ctx.fillRect(10, band, W - 20, 1);
  // 左侧菱形
  const cx = 15, cy = 8, r = 4.5;
  ctx.strokeStyle = C.gold; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy);
  ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = C.ember; ctx.fillRect(cx - 0.5, cy - 0.5, 1, 1);
}

/* 按钮凹槽：上/左暗、下/右亮 */
function well(x, y, w, h) {
  ctx.fillStyle = C.well;
  rr(x + 0.5, y + 0.5, w, h, 2.5); ctx.fill();
  ctx.fillStyle = '#080405';
  rr(x + 1.5, y + 1.5, w - 2, h - 2, 2); ctx.fill();
  ctx.strokeStyle = C.wellHi; ctx.lineWidth = 1;
  rr(x + 0.5, y + 0.5, w, h, 2.5); ctx.stroke();
}

function wells() {
  well(14, 26, 148, 22);
  well(14, 52, 148, 22);
  // 底部两枚金色小菱形（装饰）
  [W / 2 - 18, W / 2 + 18].forEach(x => {
    ctx.fillStyle = 'rgba(200,162,74,0.45)';
    ctx.beginPath();
    ctx.moveTo(x, H - 6); ctx.lineTo(x + 2, H - 4);
    ctx.lineTo(x, H - 2); ctx.lineTo(x - 2, H - 4);
    ctx.closePath(); ctx.fill();
  });
}

ctx.setTransform(S, 0, 0, S, 0, 0);
ctx.clearRect(0, 0, W, H);
base(); frame(); header(); wells();
</script>
</body>
</html>
