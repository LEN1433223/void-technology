<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>虚空样板供应器 · 符文盘（加大版）</title>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="art" width="624" height="912"></canvas>
<script>
/* ============================================================================
   虚空样板供应器 GUI —— 符文盘（加大版：208 × 304，3× 渲染）

   为什么加大：54 个 16px 槽要塞进圆环，间距(21) - 槽宽(16) = 5px 缝隙才透气。
     内环 r=40 × 12 槽  弧距 20.9
     中环 r=60 × 18 槽  弧距 20.9
     外环 r=80 × 24 槽  弧距 20.9
   外径 88 → 盘面 176，面板 208 宽，左右各留 16px。
   装饰：中心虚空之眼、环间蚀刻圆、每环 8 方位刻度、四角金边符文托、斜向扫光。
   底部标准物品栏（9×3 + 快捷栏 9）。
   ============================================================================ */
const W = 208, H = 304, S = 3;
const CX = 104, CY = 112;
const RINGS = [
  { r: 40, n: 12, a0: -90 },
  { r: 60, n: 18, a0: -90 },
  { r: 80, n: 24, a0: -90 }
];
const SLOT = 16;
const INV_X = 24, INV_Y = 218, HOTBAR_Y = 278;

const C = {
  core: '#5a1016', mid: '#2b0a0d', edge: '#140708', deep: '#0a0405',
  frame: '#5a1418', frameInner: '#16090b', rivet: '#6a2a30',
  slotFill: '#0a0d11', slotStroke: '#3a1a1f', slotHi: '#2a1216',
  gold: '#d8b25c', goldDim: 'rgba(200,162,74,0.55)',
  ember: '#ff6a4a', emberDim: 'rgba(255,90,60,0.35)'
};

const canvas = document.getElementById('art');
const ctx = canvas.getContext('2d');
const rad = d => d * Math.PI / 180;

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- 底 ---------- */
function drawBase() {
  for (let i = -H; i < W + H; i += 4) {
    ctx.fillStyle = '#150a0d';
    ctx.beginPath();
    ctx.moveTo(i, 0); ctx.lineTo(i + 2, 0);
    ctx.lineTo(i + 2 - H, H); ctx.lineTo(i - H, H);
    ctx.closePath(); ctx.fill();
  }
  const g = ctx.createRadialGradient(CX, CY, 10, CX, CY, 185);
  g.addColorStop(0.00, C.core);
  g.addColorStop(0.36, C.mid);
  g.addColorStop(0.70, C.edge);
  g.addColorStop(1.00, C.deep);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const v = ctx.createRadialGradient(CX, CY, 110, CX, CY, 250);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.60)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.013)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
}

/* ---------- 斜向扫光 ---------- */
function drawSheen() {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const grd = ctx.createLinearGradient(0, 0, W, H * 0.55);
  grd.addColorStop(0.00, 'rgba(255,190,150,0)');
  grd.addColorStop(0.40, 'rgba(255,190,150,0.05)');
  grd.addColorStop(0.50, 'rgba(255,220,190,0.10)');
  grd.addColorStop(0.60, 'rgba(255,190,150,0.04)');
  grd.addColorStop(1.00, 'rgba(255,190,150,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(3, 24, W - 6, 200);
  ctx.restore();
}

/* ---------- 外框 + 四角符文托 ---------- */
function drawFrame() {
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
  ctx.strokeStyle = C.frame; ctx.lineWidth = 2;
  ctx.strokeRect(1.5, 1.5, W - 3, H - 3);
  ctx.strokeStyle = C.frameInner; ctx.lineWidth = 1;
  ctx.strokeRect(2.5, 2.5, W - 5, H - 5);

  const arms = 14;
  [[3, 3, 1, 1], [W - 4, 3, -1, 1], [3, H - 4, 1, -1], [W - 4, H - 4, -1, -1]]
    .forEach(([x, y, sx, sy]) => {
      ctx.strokeStyle = C.goldDim; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + sx * arms, y + 0.5); ctx.lineTo(x + 0.5, y + 0.5); ctx.lineTo(x + 0.5, y + sy * arms);
      ctx.stroke();
      ctx.fillStyle = C.rivet;
      ctx.fillRect(x + sx * 5 - 1.5, y + sy * 5 - 1.5, 3, 3);
      ctx.fillStyle = C.gold;
      ctx.fillRect(x + sx * 9 - 0.5, y + sy * 9 - 0.5, 1, 1);
    });
}

/* ---------- header：标题带 + 计数胶囊 ---------- */
function drawHeader() {
  // 标题带：渐变填充与金色下沿严丝合缝（都收在 BAND 内），两端与内容边距 10px 对齐，
  // 不再画中央菱形（它会压断这条线，看起来像错位）。
  const BAND = 14;
  const g = ctx.createLinearGradient(0, 0, 0, BAND);
  g.addColorStop(0, 'rgba(90,20,24,0.55)');
  g.addColorStop(1, 'rgba(20,7,8,0.10)');
  ctx.fillStyle = g;
  ctx.fillRect(3, 3, W - 6, BAND - 3);

  ctx.fillStyle = C.goldDim;
  ctx.fillRect(10, BAND, W - 20, 1);

  // 左图标
  const cx = 15, cy = 8, r = 4.5;
  ctx.strokeStyle = C.gold; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy);
  ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = C.ember;
  ctx.fillRect(cx - 0.5, cy - 0.5, 1, 1);

}

/* ---------- 符文盘：蚀刻圆 + 方位刻度 ---------- */
function drawRuneRings() {
  // 外圈双环
  [84, 79].forEach(r => {
    ctx.strokeStyle = 'rgba(200,162,74,0.20)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke();
  });
  // 环间蚀刻圆
  [50, 70].forEach(r => {
    ctx.strokeStyle = 'rgba(255,90,60,0.14)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke();
  });
  // 每环 8 个方位刻度
  RINGS.forEach(({ r }) => {
    for (let k = 0; k < 8; k++) {
      const a = rad(-90 + k * 45 + 22.5);
      const x0 = CX + Math.cos(a) * (r + 10), y0 = CY + Math.sin(a) * (r + 10);
      const x1 = CX + Math.cos(a) * (r + 13.5), y1 = CY + Math.sin(a) * (r + 13.5);
      ctx.strokeStyle = 'rgba(200,162,74,0.32)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
  });
}

/* ---------- 中心：虚空之眼 ---------- */
function drawEye() {
  const r = 19;
  const glow = ctx.createRadialGradient(CX, CY, r * 0.4, CX, CY, r + 14);
  glow.addColorStop(0, 'rgba(255,90,60,0.55)');
  glow.addColorStop(1, 'rgba(122,15,20,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(CX, CY, r + 14, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = C.emberDim; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(CX, CY, r + 1, rad(-60), rad(20)); ctx.stroke();
  ctx.strokeStyle = 'rgba(200,162,74,0.45)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, r + 5, 0, Math.PI * 2); ctx.stroke();

  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, r);
  g.addColorStop(0.00, '#ffd7c9');
  g.addColorStop(0.10, '#ff5b3d');
  g.addColorStop(0.24, '#8f1116');
  g.addColorStop(0.52, '#2a070a');
  g.addColorStop(1.00, '#0a0405');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#080304';
  rr(CX - 1.5, CY - 8, 3, 16, 1.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,215,201,0.75)';
  ctx.fillRect(CX - 1, CY - 6, 1, 1);
}

/* ---------- 槽位 ---------- */
function ringSlots() {
  const out = [];
  RINGS.forEach(ring => {
    for (let i = 0; i < ring.n; i++) {
      const a = rad(ring.a0 + i * 360 / ring.n);
      out.push({ x: CX + Math.cos(a) * ring.r, y: CY + Math.sin(a) * ring.r, r: ring.r });
    }
  });
  return out;
}

function slotAt(cx, cy, outer) {
  const x = cx - SLOT / 2, y = cy - SLOT / 2;
  ctx.fillStyle = C.slotFill;
  rr(x + 0.5, y + 0.5, SLOT, SLOT, 2); ctx.fill();
  ctx.strokeStyle = outer ? 'rgba(200,162,74,0.30)' : C.slotStroke;
  ctx.lineWidth = 1;
  rr(x + 0.5, y + 0.5, SLOT, SLOT, 2); ctx.stroke();
  ctx.fillStyle = C.slotHi;
  ctx.fillRect(x + 2, y + 1, SLOT - 4, 1);
}

/* ---------- 物品栏 ---------- */
function drawInventory() {
  const y = 206;
  ctx.strokeStyle = 'rgba(90,20,24,0.55)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(10, y + 0.5); ctx.lineTo(W - 10, y + 0.5); ctx.stroke();
  [W / 2 - 26, W / 2 + 26].forEach(x => {
    ctx.fillStyle = 'rgba(200,162,74,0.5)';
    ctx.beginPath();
    ctx.moveTo(x, y - 2); ctx.lineTo(x + 2, y); ctx.lineTo(x, y + 2); ctx.lineTo(x - 2, y);
    ctx.closePath(); ctx.fill();
  });

  const grid = (x0, y0, cols, rows) => {
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        slotAt(x0 + c * 18 + 8, y0 + r * 18 + 8, false);
  };
  grid(INV_X, INV_Y, 9, 3);
  grid(INV_X, HOTBAR_Y, 9, 1);
}

/* ---------- 合成 ---------- */
ctx.setTransform(S, 0, 0, S, 0, 0);
ctx.clearRect(0, 0, W, H);
drawBase();
drawSheen();
drawRuneRings();
drawFrame();
drawEye();
ringSlots().forEach(s => slotAt(s.x, s.y, s.r > 70));
drawHeader();
drawInventory();
</script>
</body>
</html>
